async function actualizarProducto(event){
    event.preventDefault();
    event.stopPropagation();
    let p = Object.fromEntries(new FormData(event.target));


    console.log(p, p.name);
    console.log("Form datos put method");
    try {
                let res = await fetch(`http://localhost:3000/products`, {
                    method: "PUT",
                    headers:{
                        "content-type": "application/json"
                    },
                    body: JSON.stringify(p)
                });

                let result = await res.json();
                if(res.ok){
                    alert(result.message);
                    console.log(result.message);
                    container.innerHTML = `<h1 style="display: flex; text-align: center; font-size: 5rem; color: green;"> Producto Modificado Con Exito</h1>`;
                }else{
                    alert("ERROR", result.message);
                    console.log("Error : ", result.message);
                }
                
            } catch (error) {
                console.log("ERROR AL Modificar PRODUCTO", error);
            }
}

        function printProduct(p){

                    </li>
                    <li>
                        <button class="btn-eliminar" data-btn-modify>Modificar Producto</button>
                    </li>
            </ul>
            `;
        }
